<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha de Envase</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <h1>Linha de Envase</h1>

    <div class="statusConexao" role="status" aria-live="polite">
        <span id="indicadorConexao" class="indicadorConexao desconectado"></span>
        <span id="textoConexao">Verificando comunicação com o PLC...</span>
        <span class="separadorStatus">|</span>
        <span id="textoOperacao">Autoteste de comunicação em andamento</span>
    </div>
    <p id="mensagemErro" class="mensagemErro" role="alert" hidden></p>

    <button id="btnLiga" class="btnPainel" type="button" aria-label="Ligar linha" title="Ligar linha" disabled></button>
    <button id="btnDesliga" class="btnPainel" type="button" aria-label="Desligar linha" title="Desligar linha" disabled></button>
    <button id="btnReset" class="btnPainel" type="button" aria-label="Zerar contadores" title="Zerar contadores" disabled></button>

    <h2 class="contadorProducao">Garrafas Envasadas: <span id="contadorEnvasadas">0</span></h2>
    <h2 class="contadorProducao">Garrafas Tampadas: <span id="contadorTampadas">0</span></h2>
    <h2 class="contadorProducao">Produção Total: <span id="contadorTotal">0</span></h2>

    <div id="linhaViewport">
        <div id="linha">
            <div id="estacoes">
                <div id="enchedora">
                    <div id="statusEnvase">
                        <strong>Válvula de Envase (EV)</strong>
                        <span>ENVASE OFF</span>
                    </div>
                    <img class="valvulaEnvase" src="images/dosador_recuado.png" alt="Dosador recuado">
                    <img id="sensorS1" class="sensorPresenca" src="images/sensor_presenca.png" alt="Sensor de presença S1">
                </div>

                <div id="aplicadora">
                    <div id="statusAplicacao">
                        <strong>Aplicadora de Tampa (AT)</strong>
                        <span id="estadoAplicacao">Aguardando PLC</span>
                    </div>
                    <img class="aplicadoraTampa" src="images/aplicadora_tampa.png" alt="Aplicadora de tampas">
                    <img id="sensorS2" class="sensorPresenca" src="images/sensor_presenca.png" alt="Sensor de presença S2">
                </div>
            </div>
            <div id="garrafas"></div>
        </div>
    </div>

    <div class="instrucoesControle">
        <button id="btnInstrucoes" class="btnInstrucoes" aria-expanded="false" aria-controls="opcoesInstrucoes">
            Instruções
        </button>
        <div id="opcoesInstrucoes" class="opcoesInstrucoes" hidden>
            <button id="instrucaoOn" type="button">On</button>
            <button id="instrucaoOff" type="button">Off</button>
            <button id="instrucaoReset" type="button">Reset</button>
        </div>
    </div>

    <section id="painelInstrucoes" class="painelInstrucoes" hidden>
        <p id="textoInstrucao"></p>
    </section>

    <script src="js/app.js"></script>

</body>

</html>
