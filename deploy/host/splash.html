<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciando — Linha de Envase</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: radial-gradient(circle at 50% 20%, #123 0%, #0a1018 55%, #05080d 100%);
            color: #e8eef5;
            padding: 5vh 6vw;
            overflow: hidden;
        }

        .brand {
            text-align: center;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(28px, 4.2vw, 54px);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .brand p {
            margin: 10px 0 0;
            font-size: clamp(14px, 1.6vw, 20px);
            color: #8fa6bd;
        }

        .progressWrap {
            width: min(720px, 90vw);
        }

        .bar {
            position: relative;
            height: 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .barFill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, #1d6fd6, #34c6ff);
            box-shadow: 0 0 18px rgba(52, 198, 255, 0.55);
        }

        .barFill.indeterminate {
            background: linear-gradient(90deg, #1d6fd6, #34c6ff, #1d6fd6);
            background-size: 200% 100%;
            animation: slide 1.2s linear infinite;
        }

        @keyframes slide {
            from {
                background-position: 0% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        .percent {
            margin-top: 12px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-size: clamp(16px, 2vw, 24px);
            color: #cfe1f2;
        }

        .steps {
            width: min(720px, 90vw);
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: clamp(15px, 1.7vw, 21px);
            color: #7d93a9;
            transition: color 0.3s ease;
        }

        .step .marker {
            flex: 0 0 auto;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #3a4a5c;
            display: grid;
            place-items: center;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .step.active {
            color: #eaf3fb;
        }

        .step.active .marker {
            border-color: #34c6ff;
            box-shadow: 0 0 0 4px rgba(52, 198, 255, 0.15);
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            50% {
                box-shadow: 0 0 0 9px rgba(52, 198, 255, 0.05);
            }
        }

        .step.done {
            color: #9fe0b0;
        }

        .step.done .marker {
            border-color: #33c46f;
            background: #33c46f;
            color: #05210f;
        }

        .step.warn {
            color: #ffd98a;
        }

        .step.warn .marker {
            border-color: #f5c542;
            background: #f5c542;
            color: #2a1f00;
        }

        .step.error {
            color: #ffb3b3;
        }

        .step.error .marker {
            border-color: #e05555;
            background: #e05555;
            color: #2a0505;
        }

        .info {
            width: min(720px, 90vw);
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .infoItem {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .infoItem .label {
            font-size: clamp(10px, 1.05vw, 13px);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #6f88a0;
        }

        .infoItem .value {
            font-size: clamp(14px, 1.5vw, 18px);
            color: #cfe1f2;
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        @media (max-width: 720px) {
            .info {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <div class="brand">
        <h1>Linha de Envase</h1>
        <p id="subtitle">Inicializando o sistema…</p>
    </div>

    <div class="progressWrap">
        <div class="bar">
            <div id="barFill" class="barFill indeterminate"></div>
        </div>
        <div id="percent" class="percent">0%</div>
    </div>

    <ul class="steps" id="steps">
        <li class="step" data-step="vm"><span class="marker">•</span><span>Máquina virtual (TwinCAT/BSD) iniciando</span></li>
        <li class="step" data-step="runtime"><span class="marker">•</span><span>TwinCAT Runtime em execução</span></li>
        <li class="step" data-step="plc"><span class="marker">•</span><span>Comunicação com o PLC estabelecida</span></li>
        <li class="step" data-step="ihm"><span class="marker">•</span><span>Iniciando a IHM</span></li>
    </ul>

    <div class="info">
        <div class="infoItem">
            <span class="label">Horário do sistema</span>
            <span class="value" id="clock">--:--:--</span>
        </div>
        <div class="infoItem">
            <span class="label">Data do sistema</span>
            <span class="value" id="date">—</span>
        </div>
        <div class="infoItem">
            <span class="label">Versão da aplicação</span>
            <span class="value" id="appVersion">—</span>
        </div>
        <div class="infoItem">
            <span class="label">Versão do PLC</span>
            <span class="value" id="plcVersion">—</span>
        </div>
    </div>

    <script>
        // Ajuste aqui, se precisar, o endereço da IHM/ponte ADS na VM.
        const VM_HOST = "192.168.56.174";
        const VM_PORT = 3000;
        const IHM_URL = `http://${VM_HOST}:${VM_PORT}`;
        const WS_URL = `ws://${VM_HOST}:${VM_PORT}`;

        // As versoes vem do servidor da IHM pelo WebSocket. O fuso vem de
        // deploy/host/splash.config.json, repassado na URL pelo watcher, pois
        // a splash e aberta via file:// e nao consegue ler o arquivo local.
        const params = new URLSearchParams(window.location.search);
        const CONFIG = {
            timeZone: (params.get("timeZone") || "").trim()
        };

        // Cada etapa so conclui quando o SINAL REAL aparece E o tempo minimo
        // passou. Assim a barra reflete o carregamento de fato (e nunca "voa"
        // quando o sistema ja esta pronto antes da splash abrir).
        const stages = [
            { key: "vm", minMs: 2200 },
            { key: "runtime", minMs: 1600 },
            { key: "plc", minMs: 1200 },
            { key: "ihm", minMs: 1000 }
        ];
        const SLICE = 100 / stages.length;
        const conditions = { vm: false, runtime: false, plc: false, ihm: false };

        const elements = {
            barFill: document.getElementById("barFill"),
            percent: document.getElementById("percent"),
            subtitle: document.getElementById("subtitle"),
            clock: document.getElementById("clock"),
            date: document.getElementById("date"),
            appVersion: document.getElementById("appVersion"),
            plcVersion: document.getElementById("plcVersion")
        };

        let completed = 0;
        let stageStart = performance.now();
        let displayed = 0;
        let connected = false;
        let runtimeStopped = false;
        let finished = false;
        let socket;
        let retryTimer;

        const stepEl = key => document.querySelector(`[data-step="${key}"]`);

        function setStep(key, state) {
            const el = stepEl(key);
            if (!el) return;
            el.classList.remove("active", "done", "warn", "error");
            if (state) el.classList.add(state);
            el.querySelector(".marker").textContent =
                state === "done" ? "✓" : state === "error" ? "!" : state === "warn" ? "!" : "•";
        }

        function refreshActiveStep() {
            for (let i = 0; i < stages.length; i++) {
                const key = stages[i].key;
                if (i < completed) setStep(key, "done");
                else if (i === completed && !finished) setStep(key, runtimeStopped && key === "runtime" ? "warn" : "active");
                else setStep(key, null);
            }
        }

        function finish() {
            if (finished) return;
            finished = true;
            setStep("ihm", "done");
            elements.subtitle.textContent = "Tudo pronto. Abrindo a linha…";
            setTimeout(() => {
                if (window.location.href !== IHM_URL) window.location.replace(IHM_URL);
            }, 900);
        }

        function tryCompleteStage() {
            if (finished) return;
            if (completed >= stages.length) { finish(); return; }
            const stage = stages[completed];
            const ok = conditions[stage.key];
            const elapsed = performance.now() - stageStart;
            if (ok && elapsed >= stage.minMs) {
                completed += 1;
                stageStart = performance.now();
                if (completed >= stages.length) finish();
                else refreshActiveStep();
            }
        }
        setInterval(tryCompleteStage, 100);

        function loop() {
            const now = performance.now();
            let target = completed * SLICE;
            if (completed < stages.length) {
                const stage = stages[completed];
                let frac = Math.min(1, (now - stageStart) / stage.minMs);
                // Enquanto o sinal real nao chegou, a barra estaciona em ~85%
                // da fatia da etapa (fica perceptivel que esta aguardando).
                if (!conditions[stage.key]) frac = Math.min(frac, 0.85);
                target += frac * SLICE;
            }
            displayed += (target - displayed) * 0.06;
            if (finished) displayed += (100 - displayed) * 0.08;
            if (displayed > 99.6 && (finished || completed >= stages.length)) displayed = 100;
            elements.barFill.style.width = `${displayed.toFixed(1)}%`;
            elements.percent.textContent = `${Math.round(displayed)}%`;

            const waiting = completed === 0 && !connected;
            elements.barFill.classList.toggle("indeterminate", waiting);
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        function setupInfo() {
            let zone = CONFIG.timeZone;
            if (zone) {
                try { new Intl.DateTimeFormat("pt-BR", { timeZone: zone }); }
                catch { zone = ""; }
            }
            if (!zone) zone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

            const clockFmt = new Intl.DateTimeFormat("pt-BR", {
                timeZone: zone,
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hourCycle: "h23"
            });
            const dateFmt = new Intl.DateTimeFormat("pt-BR", {
                timeZone: zone,
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            });

            const tick = () => {
                const now = new Date();
                elements.clock.textContent = clockFmt.format(now);
                elements.date.textContent = dateFmt.format(now);
            };
            tick();
            setInterval(tick, 1000);
        }
        setupInfo();

        function applyState(message) {
            if (message.appVersion) elements.appVersion.textContent = message.appVersion;
            if (message.plcVersion) elements.plcVersion.textContent = message.plcVersion;

            if (message.plcStatus === "ready") {
                conditions.vm = true;
                conditions.runtime = true;
                conditions.plc = true;
                conditions.ihm = true;
                connected = true;
                runtimeStopped = false;
            } else if (message.plcStatus === "stopped") {
                conditions.vm = true;
                conditions.runtime = false;
                conditions.plc = false;
                conditions.ihm = true;
                connected = true;
                runtimeStopped = true;
            } else if (message.plcStatus === "checking") {
                conditions.vm = true;
                conditions.runtime = false;
                conditions.plc = false;
                conditions.ihm = true;
                connected = true;
                runtimeStopped = false;
            } else {
                conditions.runtime = false;
                conditions.plc = false;
            }
            refreshActiveStep();
        }

        function connect() {
            if (finished) return;
            socket = new WebSocket(WS_URL);

            socket.addEventListener("open", () => {
                connected = true;
                conditions.vm = true;
                conditions.ihm = true;
                refreshActiveStep();
            });

            socket.addEventListener("message", event => {
                let message;
                try { message = JSON.parse(event.data); } catch { return; }
                if (message.type !== "state") return;
                applyState(message);
            });

            socket.addEventListener("close", () => {
                connected = false;
                if (finished) return;
                conditions.vm = false;
                conditions.runtime = false;
                conditions.plc = false;
                conditions.ihm = false;
                retryTimer = window.setTimeout(connect, 1200);
            });
            socket.addEventListener("error", () => socket.close());
        }

        refreshActiveStep();
        connect();
    </script>
</body>

</html>
