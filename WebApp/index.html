<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha de Envase</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <h1>Linha de Envase</h1>

    <button id="btnLiga" class="btnPainel"></button>
    <button id="btnDesliga" class="btnPainel"></button>
    <button id="btnReset" class="btnPainel"></button>

    <h2 class="contadorProducao">Garrafas Envasadas: <span id="contadorEnvasadas">0</span></h2>
    <h2 class="contadorProducao">Garrafas Tampadas: <span id="contadorTampadas">0</span></h2>
    <h2 class="contadorProducao">Produção Total: <span id="contadorTotal">0</span></h2>

    <div id="linha">
        <div id="estacoes">
            <div id="enchedora">
                <div id="statusEnvase">
                    <strong>Válvula de Envase (EV)</strong>
                    <span>ENVASE OFF</span>
                </div>
                <img class="valvulaEnvase" src="images/Valvula Envase.png" alt="Válvula de envase">
        </div>

        <div id="aplicadora">
            <div id="statusAplicacao">
                <strong>Aplicadora de Tampa (AT)</strong>
            </div>
            <img class="aplicadoraTampa" src="images/Aplicadora Tampa.png" alt="Aplicadora de tampas">
        </div>
    </div>
    
    <div id="garrafas"></div>

           
    
    </div>

    <script src="js/app.js"></script>

</body>

</html>
